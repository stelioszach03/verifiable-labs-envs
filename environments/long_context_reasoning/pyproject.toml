[project]
name = "long-context-reasoning"
description = "Multi-hop reasoning over long documents (>10k tokens)."
version = "0.1.2"
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.1.12",
    "verifiable-labs-envs>=0.1.0a2",
]
authors = [{ name = "Stelios Zacharioudakis" }]
license = { text = "Apache-2.0" }

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["long_context_reasoning"]

[tool.verifiers.eval]
module = "long_context_reasoning"
factory = "load_environment"
