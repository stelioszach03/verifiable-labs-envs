[project]
name = "long-context-reasoning"
tags = ["long-context", "reasoning", "rlvr"]
description = "Multi-hop reasoning over long documents (>10k tokens)."
version = "0.1.3"
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.1.12",
    "verifiable-labs-envs @ git+https://github.com/stelioszach03/verifiable-labs-envs.git@main",
]
authors = [{ name = "Stelios Zacharioudakis" }]
license = { text = "Apache-2.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.verifiers.eval]
module = "long_context_reasoning"
factory = "load_environment"

[tool.hatch.build.targets.wheel]
include = ["long_context_reasoning.py"]

[tool.hatch.metadata]
# Allow git+https direct reference to verifiable-labs-envs above.
allow-direct-references = true
