[project]
name = "math-algebra-tools"
description = "Tool-use algebra simplification — primitive SymPy operations."
version = "0.1.2"
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.1.12",
    "verifiable-labs-envs>=0.1.0a2",
]
authors = [{ name = "Stelios Zacharioudakis" }]
license = { text = "Apache-2.0" }

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["math_algebra_tools"]

[tool.verifiers.eval]
module = "math_algebra_tools"
factory = "load_environment"
