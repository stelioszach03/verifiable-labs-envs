[project]
name = "code-mini-repo"
tags = ["code", "refactor", "multifile", "rlvr"]
description = "Mini-repo refactor — multi-file repo edits with pytest verification."
version = "0.1.4"
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.1.12",
    "verifiable-labs-envs @ git+https://github.com/stelioszach03/verifiable-labs-envs.git@main",
]
authors = [{ name = "Stelios Zacharioudakis" }]
license = { text = "Apache-2.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.verifiers.eval]
module = "code_mini_repo"
factory = "load_environment"

[tool.hatch.build.targets.wheel]
include = ["code_mini_repo.py"]

[tool.hatch.metadata]
# Allow git+https direct reference to verifiable-labs-envs above.
allow-direct-references = true
