[project]
name = "tool-calling-debug"
tags = ["tool-use", "debugging", "rlvr"]
description = "Debug-loop tool-calling — narrate-act-observe scaffolding."
version = "0.1.4"
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.1.12",
    "verifiable-labs-envs @ git+https://github.com/verifiablelabs/verifiable-labs-envs.git@main",
]
authors = [{ name = "Stelios Zacharioudakis" }]
license = { text = "Apache-2.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.verifiers.eval]
module = "tool_calling_debug"
factory = "load_environment"

[tool.hatch.build.targets.wheel]
include = ["tool_calling_debug.py"]

[tool.hatch.metadata]
# Allow git+https direct reference to verifiable-labs-envs above.
allow-direct-references = true
