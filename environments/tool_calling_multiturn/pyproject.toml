[project]
name = "tool-calling-multiturn"
tags = ["tool-use", "multiturn", "rlvr"]
description = "Multi-turn tool-use with primitive composition."
version = "0.1.3"
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.1.12",
    "verifiable-labs-envs>=0.1.0a2",
]
authors = [{ name = "Stelios Zacharioudakis" }]
license = { text = "Apache-2.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.verifiers.eval]
module = "tool_calling_multiturn"
factory = "load_environment"

[tool.hatch.build.targets.wheel]
include = ["tool_calling_multiturn.py"]
