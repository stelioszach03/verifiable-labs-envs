[project]
name = "tool-calling-multiturn"
description = "Multi-turn tool-use with primitive composition."
version = "0.1.2"
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.1.12",
    "verifiable-labs-envs>=0.1.0a2",
]
authors = [{ name = "Stelios Zacharioudakis" }]
license = { text = "Apache-2.0" }

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["tool_calling_multiturn"]

[tool.verifiers.eval]
module = "tool_calling_multiturn"
factory = "load_environment"
