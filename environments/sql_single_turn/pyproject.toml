[project]
name = "sql-single-turn"
tags = ["sql", "single-turn", "rlvr"]
description = "Single-turn SQL query construction with execution verification."
version = "0.1.4"
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.1.12",
    "verifiable-labs-envs @ git+https://github.com/stelioszach03/verifiable-labs-envs.git@main",
]
authors = [{ name = "Stelios Zacharioudakis" }]
license = { text = "Apache-2.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.verifiers.eval]
module = "sql_single_turn"
factory = "load_environment"

[tool.hatch.build.targets.wheel]
include = ["sql_single_turn.py"]

[tool.hatch.metadata]
# Allow git+https direct reference to verifiable-labs-envs above.
allow-direct-references = true
