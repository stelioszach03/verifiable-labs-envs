[project]
name = "math-algebra"
tags = ["math", "sympy", "algebra", "rlvr"]
description = "Single-turn algebra simplification — SymPy-verified rewards."
version = "0.1.3"
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.1.12",
    "verifiable-labs-envs @ git+https://github.com/stelioszach03/verifiable-labs-envs.git@main",
]
authors = [{ name = "Stelios Zacharioudakis" }]
license = { text = "Apache-2.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.verifiers.eval]
module = "math_algebra"
factory = "load_environment"

[tool.hatch.build.targets.wheel]
include = ["math_algebra.py"]

[tool.hatch.metadata]
# Allow git+https direct reference to verifiable-labs-envs above.
allow-direct-references = true
