[project]
name = "long-context-synthesis"
tags = ["long-context", "synthesis", "rlvr"]
description = "Synthesise an answer from multiple long-document chunks."
version = "0.1.4"
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.1.12",
    "verifiable-labs-envs @ git+https://github.com/verifiablelabs/verifiable-labs-envs.git@main",
]
authors = [{ name = "Stelios Zacharioudakis" }]
license = { text = "Apache-2.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.verifiers.eval]
module = "long_context_synthesis"
factory = "load_environment"

[tool.hatch.build.targets.wheel]
include = ["long_context_synthesis.py"]

[tool.hatch.metadata]
# Allow git+https direct reference to verifiable-labs-envs above.
allow-direct-references = true
