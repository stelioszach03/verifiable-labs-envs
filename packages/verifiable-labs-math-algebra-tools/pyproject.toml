[build-system]
requires = ["hatchling>=1.24,<1.27"]
build-backend = "hatchling.build"

[project]
name = "verifiable-labs-math-algebra-tools"
version = "0.1.2"
description = "Tool-use algebraic-simplification RL environment with SymPy primitives, conformal coverage, and SymPy-verified rewards"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Stelios Zacharioudakis" }]
keywords = [
    "reinforcement-learning",
    "rlvr",
    "evaluation",
    "scientific-ml",
    "symbolic-math",
    "sympy",
    "tool-use",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "verifiable-labs-envs-core>=0.1.1",
    "sympy>=1.12",
]

[project.urls]
Homepage = "https://github.com/stelioszach03/verifiable-labs-envs"
Issues = "https://github.com/stelioszach03/verifiable-labs-envs/issues"

[project.entry-points."verifiers.environments"]
math-algebra-tools = "verifiable_labs_math_algebra_tools:load_environment"

[tool.hatch.build.targets.wheel]
packages = ["src/verifiable_labs_math_algebra_tools"]
