[build-system]
requires = ["hatchling>=1.24,<1.27"]
build-backend = "hatchling.build"

[project]
name = "verifiable-labs-sql-single-turn"
version = "0.1.1"
description = "Single-turn text-to-SQL RL environment with SQLite sandbox, result-set comparator, and conformal coverage"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Stelios Zacharioudakis" }]
keywords = [
    "reinforcement-learning",
    "rlvr",
    "evaluation",
    "text-to-sql",
    "sqlite",
    "verifiable-labs",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
]
dependencies = [
    "verifiable-labs-envs-core>=0.1.1",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/stelioszach03/verifiable-labs-envs"
Issues = "https://github.com/stelioszach03/verifiable-labs-envs/issues"

[project.entry-points."verifiers.environments"]
sql-single-turn = "verifiable_labs_sql_single_turn:load_environment"

[tool.hatch.build.targets.wheel]
packages = ["src/verifiable_labs_sql_single_turn"]
