[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "verifiable-labs-code-mini-repo"
version = "0.1.1"
description = "Synthetic-mini-repo code-execution RL environment with multi-file edit and conformal coverage"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Stelios Zacharioudakis" }]
keywords = [
    "reinforcement-learning",
    "rlvr",
    "evaluation",
    "code-execution",
    "swe-bench",
    "repo-scale",
    "verifiable-labs",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "verifiable-labs-envs-core>=0.1.1",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/stelioszach03/verifiable-labs-envs"
Issues = "https://github.com/stelioszach03/verifiable-labs-envs/issues"

[project.entry-points."verifiers.environments"]
code-mini-repo = "verifiable_labs_code_mini_repo:load_environment"

[tool.hatch.build.targets.wheel]
packages = ["src/verifiable_labs_code_mini_repo"]
