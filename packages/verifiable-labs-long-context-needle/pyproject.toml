[build-system]
requires = ["hatchling>=1.24,<1.27"]
build-backend = "hatchling.build"

[project]
name = "verifiable-labs-long-context-needle"
version = "0.1.2"
description = "Single-turn long-context needle-in-haystack RL environment with procedural multi-document corpus and conformal coverage"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Stelios Zacharioudakis" }]
keywords = [
    "reinforcement-learning",
    "rlvr",
    "evaluation",
    "long-context",
    "needle-in-haystack",
    "verifiable-labs",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "verifiable-labs-envs-core>=0.1.1",
    "numpy>=1.26",
    "tiktoken>=0.5",
]

[project.urls]
Homepage = "https://github.com/stelioszach03/verifiable-labs-envs"
Issues = "https://github.com/stelioszach03/verifiable-labs-envs/issues"

[project.entry-points."verifiers.environments"]
long-context-needle = "verifiable_labs_long_context_needle:load_environment"

[tool.hatch.build.targets.wheel]
packages = ["src/verifiable_labs_long_context_needle"]
