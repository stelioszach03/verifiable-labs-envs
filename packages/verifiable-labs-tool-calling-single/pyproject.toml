[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "verifiable-labs-tool-calling-single"
version = "0.1.1"
description = "Single-pass procedural tool-calling RL environment with mock primitives, D2-C composite reward, and conformal coverage"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Stelios Zacharioudakis" }]
keywords = [
    "reinforcement-learning",
    "rlvr",
    "evaluation",
    "tool-calling",
    "function-calling",
    "verifiable-labs",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "verifiable-labs-envs-core @ git+https://github.com/stelioszach03/verifiable-labs-envs.git@main#subdirectory=packages/verifiable-labs-envs-core",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/stelioszach03/verifiable-labs-envs"
Issues = "https://github.com/stelioszach03/verifiable-labs-envs/issues"

[project.entry-points."verifiers.environments"]
tool-calling-single = "verifiable_labs_tool_calling_single:load_environment"

[tool.hatch.build.targets.wheel]
packages = ["src/verifiable_labs_tool_calling_single"]
